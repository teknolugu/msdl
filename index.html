<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="description"
        content="Microsoft Software Download Listing lets you browse and download products from Microsoft Software Download.">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="og:site_name" content="Microsoft Software Download Listing">
    <meta property="og:title" content="Microsoft Software Download Listing">
    <meta property="og:type" content="website">
    <meta property="og:description"
        content="Microsoft Software Download Listing lets you browse and download products from Microsoft Software Download.">
    <meta property="og:image" content="/img/cover.png">
    <meta property="og:url" content="https://msdl.wintin.eu.org/">

    <title>Microsoft Software Download Listing</title>

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/msdl.js"></script>
</head>

<body>
    <h1>Microsoft Software Download Listing</h1>

    <noscript>
        <p>This page requires JavaScript to work.</p>
    </noscript>

    <div id="products-list">
        <h2>Select product</h2>
        <input id="search-products" type="search" placeholder="Search with regex..." onInput="updateResults();">
        <div id="quick-search">
            📌
            <button onClick="setSearch('Windows 8\\.1');">Windows 8.1</button>
            <button onClick="setSearch('Windows 10 22H2');">Latest Windows 10</button>
            <button onClick="setSearch('24H2');">Latest Windows 11</button>
        </div>
        <table style="table-layout: auto;">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
        </table>
    </div>

    <div id="msdl-ms-content"></div>

    <div id="msdl-please-wait">
        <h2>Please wait...</h2>
        <p>Please wait while the data you requested is being retrieved.</p>
    </div>

    <div id="msdl-processing-error">
        <h2>Error</h2>
        <p>An error has occurred while processing your request. If reloading the page does not work, create an issue on <a href="https://github.com/TeknoLugu/msdl/issues">GitHub</a>.</p>
    </div>

    <div id="back-to-products">
        <hr>
        <button onClick="backToProducts();">Go back to the product list</button>
    </div>

    <input id="msdl-session-id" type="hidden">
    <div style="text-align: center; padding-bottom: 8vh;">
        <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fmsdl.wintin.eu.org&label=hits&icon=bar-chart-fill&color=%23198754" alt="hits">
    </div>
    <script type='text/javascript' src='https://edge-cdn.trakteer.id/js/trbtn-overlay.min.js?v=14-05-2025'></script>
    <script type='text/javascript' class='troverlay'>(function() {var trbtnId = trbtnOverlay.init('Donate','#be1e2d','https://trakteer.id/jovanzers/tip/embed/modal','https://mirror-uploads.trakteer.id/images/units/uic-ZxzS7RYcahvXhGnmQCtZgTeBBYPSc02q1726767013.png','40','floating-left');trbtnOverlay.draw(trbtnId);})();</script>
</body>

</html>
